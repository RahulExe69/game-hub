<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💣 Minesweeper – Game Hub</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <style>
    .mine-grid {
      display: grid;
      gap: 3px;
      user-select: none;
      -webkit-user-select: none;
    }
    .mine-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: clamp(0.65rem, 2.5vw, 1rem);
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mine-cell:hover { background: var(--bg-card-hover); }
    .mine-cell.revealed {
      background: #0a0a22;
      border-color: #1a1a3a;
      cursor: default;
    }
    .mine-cell.flagged {
      background: rgba(255,45,120,0.15);
      border-color: var(--neon-pink);
    }
    .mine-cell.mine-hit { background: rgba(255,45,120,0.4); animation: explode 0.4s ease; }
    @keyframes explode { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
    .mine-cell.mine-shown { background: rgba(255,45,120,0.2); }

    .n1{color:#00f5ff} .n2{color:#39ff14} .n3{color:#ff8c00}
    .n4{color:#9d4edd} .n5{color:#ff2d78} .n6{color:#ffd60a}
    .n7{color:#fff} .n8{color:#aaa}

    .diff-btns { display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center; }
    .diff-btn {
      padding: 0.4rem 1rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .diff-btn.active, .diff-btn:hover {
      border-color: var(--neon-purple);
      color: var(--neon-cyan);
      background: rgba(157,78,221,0.15);
    }
    .status-banner { font-size:1.1rem; font-weight:700; min-height:1.5rem; text-align:center; }
  </style>
</head>
<body class="game-page">
  <nav class="game-nav">
    <a href="../../index.html" class="btn-back">← Back to Hub</a>
    <span class="game-nav-title">💣 Minesweeper</span>
    <div class="score-panel">
      <div class="score-box">
        <div class="score-label">Mines</div>
        <div class="score-value" id="mineCount" style="color:var(--neon-pink)">10</div>
      </div>
      <div class="score-box">
        <div class="score-label">Time</div>
        <div class="score-value" id="timer" style="color:var(--neon-yellow)">0</div>
      </div>
    </div>
  </nav>

  <div class="game-container">
    <div class="diff-btns">
      <button class="diff-btn active" data-diff="easy">😊 Easy (9×9)</button>
      <button class="diff-btn" data-diff="medium">😬 Medium (12×12)</button>
      <button class="diff-btn" data-diff="hard">💀 Hard (16×16)</button>
    </div>

    <div class="status-banner" id="statusBanner"></div>

    <div class="mine-grid" id="mineGrid"></div>

    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
      <button class="btn-action" id="newGameBtn">New Game</button>
    </div>

    <div class="how-to-play">
      <strong>How to Play:</strong> <strong>Left-click</strong> to reveal a cell.
      <strong>Right-click</strong> or <strong>long-press</strong> to flag a mine.
      Reveal all safe cells to win!
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
