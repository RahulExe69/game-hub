<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐦 Flappy Bird – Game Hub</title>
  <link rel="stylesheet" href="../../css/style.css"/>
</head>
<body class="game-page">
  <nav class="game-nav">
    <a href="../../index.html" class="btn-back">← Back to Hub</a>
    <span class="game-nav-title">🐦 Flappy Bird</span>
    <div class="score-panel">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </nav>

  <div class="game-container">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="gameCanvas" width="360" height="540"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title">🐦 Flappy Bird</div>
        <div class="overlay-score" id="overlayMsg">Tap, Click or Space to flap</div>
        <button class="btn-action" id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="how-to-play">
      <strong>How to Play:</strong> <strong>Click</strong>, <strong>Tap</strong>, or press
      <strong>Space</strong> to flap. Fly through the gaps in the pipes. Don't hit anything!
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
