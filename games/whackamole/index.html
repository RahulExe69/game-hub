<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔨 Whack-a-Mole – Game Hub</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <style>
    .mole-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: min(360px, 90vw);
    }
    .hole {
      aspect-ratio: 1;
      background: radial-gradient(ellipse at 40% 30%, #2a1a0a, #0a0505);
      border-radius: 50%;
      border: 3px solid #3a2010;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: inset 0 8px 20px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.5);
    }
    .mole {
      font-size: clamp(2rem, 8vw, 3.2rem);
      position: absolute;
      bottom: -100%;
      transition: bottom 0.12s ease-out;
      user-select: none;
      line-height: 1;
      filter: drop-shadow(0 -2px 4px rgba(0,0,0,0.5));
    }
    .hole.active .mole { bottom: 5%; }
    .hole.whacked .mole {
      bottom: 5%;
      animation: whackAnim 0.3s ease forwards;
    }
    @keyframes whackAnim {
      0%   { transform: scale(1) rotate(0); opacity: 1; }
      50%  { transform: scale(1.4) rotate(20deg); opacity: 0.7; }
      100% { transform: scale(0.3) rotate(-20deg) translateY(40px); opacity: 0; }
    }
    .timer-bar {
      width: min(360px, 90vw);
      height: 10px;
      background: var(--border);
      border-radius: 5px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      border-radius: 5px;
      transition: width 0.1s linear, background 0.5s;
    }
    .timer-fill.low { background: linear-gradient(90deg, var(--neon-pink), #ff8c00); }
    .game-over-msg { font-size:1.8rem; font-weight:900; color:var(--neon-pink); display:none; }
  </style>
</head>
<body class="game-page">
  <nav class="game-nav">
    <a href="../../index.html" class="btn-back">← Back to Hub</a>
    <span class="game-nav-title">🔨 Whack-a-Mole</span>
    <div class="score-panel">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Time</div>
        <div class="score-value" id="timer" style="color:var(--neon-yellow)">30</div>
      </div>
    </div>
  </nav>

  <div class="game-container">
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

    <div class="mole-grid" id="moleGrid"></div>

    <div class="game-over-msg" id="gameOverMsg"></div>

    <button class="btn-action" id="startBtn">Start Game</button>

    <div class="how-to-play">
      <strong>How to Play:</strong> Click or tap the moles as they pop up!
      You have <strong>30 seconds</strong> — score as high as you can!
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
