<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🏓 Pong – Game Hub</title>
  <link rel="stylesheet" href="../../css/style.css"/>
</head>
<body class="game-page">
  <nav class="game-nav">
    <a href="../../index.html" class="btn-back">← Back to Hub</a>
    <span class="game-nav-title">🏓 Pong</span>
    <div class="score-panel">
      <div class="score-box">
        <div class="score-label">You</div>
        <div class="score-value" id="playerScore" style="color:var(--neon-cyan)">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">AI</div>
        <div class="score-value" id="aiScore" style="color:var(--neon-pink)">0</div>
      </div>
    </div>
  </nav>

  <div class="game-container">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="gameCanvas" width="480" height="320"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title">🏓 Pong</div>
        <div class="overlay-score" id="overlayMsg">First to 7 points wins</div>
        <button class="btn-action" id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="how-to-play">
      <strong>How to Play:</strong> <strong>W/S</strong> or <strong>↑/↓ Arrow Keys</strong>
      to move your paddle (left side). First to <strong>7 points</strong> wins!
      Touch/drag on mobile.
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
