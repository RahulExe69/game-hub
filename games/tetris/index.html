<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🟦 Tetris – Game Hub</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <style>
    .tetris-layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 120px;
    }
    .next-label, .panel-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    #nextCanvas { border: 2px solid var(--border); border-radius: 6px; background: #06060f; }
    .level-badge {
      background: linear-gradient(135deg, var(--neon-purple), #6a00f4);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      text-align: center;
    }
    .level-badge .score-value { font-size: 1.3rem; }
    /* Mobile controls */
    .tetris-controls {
      display: none;
      gap: 0.5rem;
      flex-direction: column;
      align-items: center;
      margin-top: 0.5rem;
    }
    @media (pointer: coarse) { .tetris-controls { display: flex; } }
    .ctrl-row { display: flex; gap: 0.5rem; }
    .ctrl-btn {
      width: 52px; height: 52px;
      background: rgba(157,78,221,0.2);
      border: 1px solid rgba(157,78,221,0.4);
      border-radius: 10px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      color: var(--text-primary);
    }
    .ctrl-btn:active { background: rgba(157,78,221,0.5); }
  </style>
</head>
<body class="game-page">
  <nav class="game-nav">
    <a href="../../index.html" class="btn-back">← Back to Hub</a>
    <span class="game-nav-title">🟦 Tetris</span>
  </nav>

  <div class="game-container">
    <div class="tetris-layout">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="gameCanvas" width="200" height="400"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-title">🟦 Tetris</div>
          <div class="overlay-score" id="overlayMsg">Arrow keys to play</div>
          <button class="btn-action" id="startBtn">Start Game</button>
        </div>
      </div>

      <div class="side-panel">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Lines</div>
          <div class="score-value" id="lines" style="color:var(--neon-green)">0</div>
        </div>
        <div class="level-badge">
          <div class="score-label">Level</div>
          <div class="score-value" id="level" style="color:var(--neon-yellow)">1</div>
        </div>
        <div>
          <div class="next-label">Next</div>
          <canvas id="nextCanvas" width="80" height="80"></canvas>
        </div>
      </div>
    </div>

    <!-- Mobile controls -->
    <div class="tetris-controls">
      <div class="ctrl-row">
        <button class="ctrl-btn" id="cRotate">🔄</button>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="cLeft">◀</button>
        <button class="ctrl-btn" id="cDown">▼</button>
        <button class="ctrl-btn" id="cRight">▶</button>
      </div>
    </div>

    <div class="how-to-play">
      <strong>How to Play:</strong>
      <strong>← →</strong> Move &bull; <strong>↑</strong> Rotate &bull; <strong>↓</strong> Soft drop &bull;
      <strong>Space</strong> Hard drop. Clear lines to score!
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
